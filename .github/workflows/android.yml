name: Android bridge

on:
  push:
    branches: ["**"]
    paths:
      - "android/jev-mobile-bridge/**"
      - "android/jev-mobile-test-app/**"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "android/jev-mobile-bridge/**"
      - "android/jev-mobile-test-app/**"
      - ".github/workflows/android.yml"

permissions:
  contents: read

jobs:
  lint-and-build:
    name: Lint and build Android bridge
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android/jev-mobile-bridge
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - name: Verify Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4
      - name: Lint and build debug APK
        run: ./gradlew --no-daemon lint assembleDebug
      - name: Lint and build Android acceptance fixture
        run: ./gradlew --no-daemon :test-app:lint :test-app:assembleDebug
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: jev-mobile-bridge-debug-apk
          path: android/jev-mobile-bridge/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
