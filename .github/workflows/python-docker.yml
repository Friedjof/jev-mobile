name: Python and Docker MCP

on:
  push:
    branches: ["**"]
    paths:
      - "src/**"
      - "tests/**"
      - "pyproject.toml"
      - "uv.lock"
      - "Dockerfile"
      - "docker-compose.yml"
      - "compose.production.yml"
      - "deploy/**"
      - "android/jev-mobile-test-app/**"
      - ".dockerignore"
      - ".github/workflows/python-docker.yml"
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - "pyproject.toml"
      - "uv.lock"
      - "Dockerfile"
      - "docker-compose.yml"
      - "compose.production.yml"
      - "deploy/**"
      - "android/jev-mobile-test-app/**"
      - ".dockerignore"
      - ".github/workflows/python-docker.yml"

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/jev-mobile-mcp

jobs:
  lint-test-build:
    name: Lint, test, and build MCP image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install locked dependencies
        run: uv sync --frozen --all-groups
      - name: Lint
        run: uv run ruff check .
      - name: Test
        run: uv run pytest -q
      - name: Verify MCP server tools
        run: |
          uv run python - <<'PY'
          import asyncio
          from jev_mobile.mcp_server import server

          names = {tool.name for tool in asyncio.run(server.list_tools())}
          assert names == {"start_task", "get_task", "get_task_events", "cancel_task", "answer_task", "get_device_status"}
          print("MCP tools:", ", ".join(sorted(names)))
          PY
      - name: Validate production deployment artifacts
        env:
          JEV_MOBILE_ENV_FILE: deploy/docker/jev-mobile.env.example
          JEV_MOBILE_MCP_ENV_FILE: deploy/docker/mcp.env.example
          JEV_MOBILE_DATA_DIR: /tmp/jev-mobile-data
          JEV_MOBILE_ADB_KEYS_DIR: /tmp/jev-mobile-adb
          JEV_MOBILE_TYPESAFE_API_KEY_FILE: /tmp/typesafe-api-key
          JEV_MOBILE_USB_GID: "46"
          JEV_MOBILE_IMAGE: ghcr.io/friedjof/jev-mobile-mcp:0.1.2
        run: |
          docker compose -f compose.production.yml config --quiet
          sh -n deploy/synology/jev-mobile-usb-hook
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: metadata
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-
      - name: Build and publish MCP image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
