# Secure production override. Use together with the repository Compose file:
# docker compose -f docker-compose.yml -f deploy/docker/compose.secrets.yml up -d
services:
  worker:
    environment:
      # *_FILE takes precedence over a legacy direct environment variable.
      TYPESAFE_API_KEY_FILE: /run/secrets/typesafe_api_key
    secrets:
      - typesafe_api_key

secrets:
  typesafe_api_key:
    file: ${JEV_MOBILE_TYPESAFE_API_KEY_FILE:?Set JEV_MOBILE_TYPESAFE_API_KEY_FILE to the host secret file}
